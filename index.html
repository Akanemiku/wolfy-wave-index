<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>狼波周期指数 · Wolfy Wave Index</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-name" id="brand-name">狼波周期指数</div>
    </div>
    <div class="topbar-right">
      <div class="stats">
        <div class="price-block">
          <span id="stat-price" class="price">—</span>
          <span id="stat-chg" class="chg">—</span>
        </div>
        <div class="price-block">
          <span id="stat-wave" class="price wave-value">—</span>
          <span id="stat-wave-label" class="wave-label">狼波指数</span>
        </div>
        <div class="chip" id="stat-cycle">—</div>
        <div class="chip" id="stat-bottom">—</div>
      </div>
      <div class="top-actions">
        <div class="lang-switch" title="语言 / Language">
          <button class="lang-opt" data-lang="zh">中</button>
          <button class="lang-opt" data-lang="en">EN</button>
        </div>
        <button class="icon-btn" id="theme-toggle" title="主题 / Theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M20.5 14.4A8.5 8.5 0 0 1 9.6 3.5a8.5 8.5 0 1 0 10.9 10.9z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="toolbar-group">
      <div class="seg" id="tf-group">
        <button data-tf="day" class="active">144 区块</button>
        <button data-tf="week">1,008 区块</button>
        <button data-tf="month">4,368 区块</button>
      </div>
      <div class="seg" id="style-group">
        <button data-style="candles" class="active">K线</button>
        <button data-style="line">折线</button>
      </div>
    </div>
    <div class="toolbar-group">
      <div class="seg">
        <button id="scale-toggle" class="active" title="对数/线性坐标切换">对数</button>
        <button id="annot-toggle" class="active" title="显示/隐藏周期标注">标注</button>
      </div>
    </div>
  </div>

  <main class="chart-wrap">
    <div id="chart"></div>
    <div id="legend" class="legend"></div>

    <div id="notice" class="notice" hidden>
      <span id="notice-text"></span>
      <button id="notice-close" aria-label="关闭">×</button>
    </div>

    <div id="loading" class="loading">
      <div class="loading-spinner"></div>
      <div id="loading-text">加载行情数据中…</div>
    </div>
  </main>

  <div id="block-axis" class="block-axis">
    <div id="bx-cursor" class="bx-cursor" hidden></div>
  </div>

  <footer class="foot">
    <span id="foot-data">数据来源：Bitstamp / Coinbase Exchange</span>
    <span class="foot-sep">·</span>
    <span id="foot-theory">牛市 157,500 块 / 熊市 52,500 块，减半在牛市正中</span>
    <span class="foot-sep">·</span>
    <span id="foot-disclaimer">周期理论仅供参考，不构成投资建议</span>
  </footer>

  <script>
    // 必须放在模块脚本之外：file:// 下浏览器根本不会加载 ES module，
    // 模块内的检测代码是死代码
    if (location.protocol === 'file:') {
      document.getElementById('loading-text').textContent =
        '不能直接双击打开本页面，请在项目目录运行 python3 -m http.server 8080 后访问 http://localhost:8080';
      document.querySelector('.loading-spinner').style.display = 'none';
    }
  </script>
  <script src="vendor/lightweight-charts.standalone.production.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
