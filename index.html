<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>杀破狼 WolfyXBT · 比特币四年周期理论</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="chart"></div>

  <div class="title-overlay">
    <div class="title-main">杀破狼 WolfyXBT</div>
    <div class="title-sub">比特币四年周期理论刻舟求剑</div>
  </div>

  <div id="notice" class="notice" hidden>
    <span id="notice-text"></span>
    <button id="notice-close" aria-label="关闭">×</button>
  </div>

  <div id="loading" class="loading">
    <div class="loading-spinner"></div>
    <div id="loading-text">加载行情数据中…</div>
  </div>

  <script>
    // 必须放在模块脚本之外：file:// 下浏览器根本不会加载 ES module，
    // 模块内的检测代码是死代码
    if (location.protocol === 'file:') {
      document.getElementById('loading-text').textContent =
        '不能直接双击打开本页面，请在项目目录运行 python3 -m http.server 8080 后访问 http://localhost:8080';
      document.querySelector('.loading-spinner').style.display = 'none';
    }
  </script>
  <script src="vendor/lightweight-charts.standalone.production.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
