<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>狼波周期指数 · Wolfy Wave Index</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23EC2626'/%3E%3Cstop offset='.15' stop-color='%23F69C1C'/%3E%3Cstop offset='.3' stop-color='%23D6DF38'/%3E%3Cstop offset='.5' stop-color='%2348BE50'/%3E%3Cstop offset='.75' stop-color='%233EC4E9'/%3E%3Cstop offset='1' stop-color='%23263CDB'/%3E%3C/linearGradient%3E%3Crect width='32' height='32' rx='5' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <!-- 品牌标记：狼波色谱六个主色锚点的垂直渐变（1=牛顶红在上，0=熊底蓝在下），
           渐变位置 = 1 - 指数值，与右侧色标同一映射 -->
      <svg class="brand-mark" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
        <defs>
          <linearGradient id="brand-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#EC2626"/>
            <stop offset="0.15" stop-color="#F69C1C"/>
            <stop offset="0.30" stop-color="#D6DF38"/>
            <stop offset="0.50" stop-color="#48BE50"/>
            <stop offset="0.75" stop-color="#3EC4E9"/>
            <stop offset="1" stop-color="#263CDB"/>
          </linearGradient>
        </defs>
        <rect width="32" height="32" rx="5" fill="url(#brand-grad)"/>
      </svg>
      <div class="brand-text">
        <div class="brand-name" id="brand-name">狼波周期指数</div>
        <div class="brand-sub" id="brand-sub">WOLFY WAVE INDEX</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="stats">
        <div class="stat">
          <span class="stat-label"><span id="label-price">比特币价格</span><i class="live-dot"></i></span>
          <div class="stat-value">
            <span id="stat-price" class="price">—</span>
            <span id="stat-chg" class="chg">—</span>
          </div>
        </div>
        <div class="stat" id="stat-height-cell">
          <span class="stat-label"><span id="label-height">区块高度</span><i class="live-dot"></i></span>
          <div class="stat-value">
            <span id="stat-height" class="price">—</span>
          </div>
        </div>
        <div class="stat" id="stat-wave-cell" title="0 = 熊底 · 1 = 牛顶">
          <span class="stat-label"><span id="stat-wave-label">狼波周期指数</span><i class="live-dot"></i></span>
          <div class="stat-value">
            <span id="stat-wave" class="price">—</span>
          </div>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="lang-toggle" title="语言">
          <span class="glyph-zh">中</span>
          <span class="glyph-en">EN</span>
        </button>
        <button class="icon-btn" id="theme-toggle" title="深/浅主题">
          <svg class="icon-sun" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M20.5 14.4A8.5 8.5 0 0 1 9.6 3.5a8.5 8.5 0 1 0 10.9 10.9z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="toolbar-group">
      <div class="seg" id="tf-group" title="分桶粒度（每根 K 线的区块数）">
        <button data-tf="day" class="active">144 区块（日）</button>
        <button data-tf="week">1,008 区块（周）</button>
        <button data-tf="month">4,368 区块（月）</button>
      </div>
      <div class="seg" id="style-group" title="图表类型">
        <button data-style="wave" class="active">狼波着色</button>
        <button data-style="candles">K线</button>
        <button data-style="line">折线</button>
      </div>
    </div>
    <div class="toolbar-group">
      <div class="seg" id="scale-group" title="价格坐标">
        <button data-scale="log" class="active">对数</button>
        <button data-scale="linear">线性</button>
      </div>
      <button id="annot-toggle" class="toggle-btn active" title="显示/隐藏周期标注">
        <svg class="icon-eye" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="icon-eye-off" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        <span id="annot-label">标注</span>
      </button>
    </div>
  </div>

  <main class="chart-wrap">
    <div class="chart-host">
      <div id="chart"></div>
      <div id="now-line" class="now-line" hidden></div>
      <div id="now-dot-price" class="now-dot" hidden></div>
      <div id="now-dot-wave" class="now-dot" hidden></div>
      <div id="legend" class="legend"><b>BTC/USD</b></div>
      <div id="phase-legend" class="legend phase-legend" hidden></div>
      <div id="tooltip" class="chart-tooltip" hidden></div>
      <button id="phase-toggle" class="phase-toggle active" title="显示/隐藏狼波指数窗格">
        <svg class="icon-collapse" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        <svg class="icon-expand" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"/></svg>
        <span id="phase-label">隐藏</span>
      </button>
    </div>

    <aside class="wave-scale" id="wave-scale" title="狼波指数色标">
      <div class="ws-label" id="ws-top">牛顶</div>
      <div class="ws-body">
        <div class="ws-bar" id="ws-bar">
          <div class="ws-marker" id="ws-marker" hidden></div>
        </div>
        <div class="ws-ticks">
          <span>1.00</span><span>0.75</span><span>0.50</span><span>0.25</span><span>0.00</span>
        </div>
      </div>
      <div class="ws-label" id="ws-bottom">熊底</div>
    </aside>

    <div id="notice" class="notice" hidden>
      <span id="notice-text"></span>
      <button id="notice-close" aria-label="关闭">×</button>
    </div>

    <div id="loading" class="loading">
      <div class="loading-brand" id="loading-brand">狼波周期指数</div>
      <div class="loading-spinner"></div>
      <div id="loading-text">加载行情数据中…</div>
    </div>
  </main>

  <div id="block-axis" class="block-axis">
    <span id="bx-name" class="bx-name">区块高度</span>
    <div id="bx-now" class="bx-now" hidden></div>
    <div id="bx-cursor" class="bx-cursor" hidden></div>
  </div>

  <footer class="foot">
    <span id="foot-data">数据来源：Bitstamp / Coinbase Exchange</span>
  </footer>

  <script>
    // 必须放在模块脚本之外：file:// 下浏览器根本不会加载 ES module，
    // 模块内的检测代码是死代码
    if (location.protocol === 'file:') {
      document.getElementById('loading-text').textContent =
        '不能直接双击打开本页面，请在项目目录运行 python3 -m http.server 8080 后访问 http://localhost:8080 '
        + '/ This page cannot be opened via file:// — run "python3 -m http.server 8080" in the project folder, then visit http://localhost:8080';
      document.querySelector('.loading-spinner').style.display = 'none';
    }
  </script>
  <script src="vendor/lightweight-charts.standalone.production.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
